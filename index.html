<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wish Jinny</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Header -->
  <header>
    <img src="assets/logo.png" alt="Wish Jinny Logo" class="logo">
    <h1>Welcome to Wish Jinny</h1>
  </header>

  <!-- Hero Section: Genie Image -->
  <main>
    <section class="hero">
      <img src="assets/genie.png" alt="Magic Genie" class="hero-img">
      <p>Rub the lamp and make your wish come true!</p>
    </section>

    <!-- Discount Section -->
    <section class="discount-offer">
      <video autoplay muted loop>
        <source src="assets/discount-offer.mp4" type="video/mp4">
      </video>
      <h2>✨ Special Offer: 50% Off ✨</h2>
      <p>Cosmetics, Jewellery, Toys & more at magical prices!</p>
    </section>

    <!-- Lamp Section -->
    <section class="lamp-section">
      <img src="assets/magic-lamp-discount.jpg" alt="Magical Lamp">
      <p>Rub the lamp for hidden offers to appear!</p>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <img src="assets/lamp-icon.png" alt="Lamp Icon">
    <p>&copy; 2026 Wish Jinny</p>
  </footer>

  <script src="scripts/jinny-ai.js"></script>
</body>
</html>
